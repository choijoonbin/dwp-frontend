<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">SKAX Pangyo workplace floor plan</title>
  <description id="description">A verification floor plan with meeting areas, open work zones, an east-west corridor, elevators, stairs, and a main entrance.</description>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#dbe5f2" stroke-width="1"/>
    </pattern>
    <style>
      .wall{fill:none;stroke:#52657a;stroke-width:7;stroke-linejoin:round}.partition{fill:#f7f9fc;stroke:#9aabbd;stroke-width:3}.corridor{fill:#e8f1ff;stroke:#7ca9e8;stroke-width:2}.core{fill:#eef2f6;stroke:#75879b;stroke-width:3}.label{font:600 22px system-ui,sans-serif;fill:#405267}.small{font:600 18px system-ui,sans-serif;fill:#53677d}.door{fill:none;stroke:#3f78c5;stroke-width:4}.route{fill:none;stroke:#9bbdec;stroke-width:7;stroke-dasharray:12 10;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fbfcfe"/>
  <rect x="28" y="28" width="1144" height="704" rx="8" fill="url(#grid)" class="wall"/>
  <rect x="54" y="56" width="218" height="152" rx="8" class="partition"/>
  <rect x="288" y="56" width="218" height="152" rx="8" class="partition"/>
  <rect x="522" y="56" width="132" height="152" rx="8" class="partition"/>
  <rect x="672" y="56" width="462" height="152" rx="8" class="partition"/>
  <text x="76" y="92" class="label">MEETING</text>
  <text x="694" y="92" class="label">FOCUS / SUPPORT</text>
  <rect x="54" y="238" width="540" height="154" rx="8" class="partition"/>
  <rect x="612" y="238" width="522" height="154" rx="8" class="partition"/>
  <text x="76" y="274" class="label">FOCUS WORK ZONE</text>
  <text x="634" y="274" class="label">PROJECT ZONE</text>
  <rect x="54" y="414" width="1080" height="70" rx="12" class="corridor"/>
  <text x="76" y="456" class="small">MAIN CORRIDOR</text>
  <path d="M144 449H600H1056M696 449V593M864 449V593M1056 449L1104 684" class="route"/>
  <rect x="54" y="506" width="540" height="198" rx="8" class="partition"/>
  <rect x="612" y="506" width="252" height="198" rx="8" class="partition"/>
  <rect x="882" y="506" width="252" height="132" rx="8" class="partition"/>
  <text x="76" y="544" class="label">OPEN WORKPLACE</text>
  <rect x="656" y="564" width="86" height="88" rx="8" class="core"/>
  <rect x="820" y="564" width="86" height="88" rx="8" class="core"/>
  <path d="M674 608h50M699 583l25 25-25 25" class="door"/>
  <path d="M838 630l18-18 18 18 18-18" class="door"/>
  <text x="650" y="682" class="small">ELEVATOR</text>
  <text x="826" y="682" class="small">STAIR</text>
  <path d="M1078 732v-72h94" class="door"/>
  <text x="1002" y="702" class="small">MAIN ENTRY</text>
</svg>
