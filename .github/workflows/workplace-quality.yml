name: Workplace full quality

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workplace-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workplace-full:
    name: Workplace desktop and mobile acceptance (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/3
            artifact: 1
          - shard: 2/3
            artifact: 2
          - shard: 3/3
            artifact: 3
    env:
      YARN_ENABLE_HARDENED_MODE: '1'
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-workplace
      PLAYWRIGHT_OUTPUT_DIR: test-results/workplace

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Restore Yarn cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Install Playwright Chromium
        run: corepack yarn playwright install --with-deps chromium

      - name: Run complete hermetic Workplace suite
        run: corepack yarn test:e2e:workplace --shard=${{ matrix.shard }}

      - name: Upload Workplace acceptance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: workplace-e2e-report-${{ matrix.artifact }}
          path: |
            playwright-report-workplace/
            test-results/workplace/
          if-no-files-found: error
          retention-days: 30
