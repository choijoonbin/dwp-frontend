name: Release readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize-release:
    name: Verify approved release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Validate evidence registry integrity
        run: corepack yarn release:evidence:check

      - name: Enforce release authorization
        run: corepack yarn release:gate
