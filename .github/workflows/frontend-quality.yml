name: Frontend quality

on:
  push:
    branches: [main, dev, dwp-dev]
  pull_request:
    branches: [main, dev, dwp-dev]

permissions:
  contents: read

jobs:
  quality:
    name: Static, bundle, and runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YARN_ENABLE_HARDENED_MODE: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Restore Yarn cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enforce Yarn workspace policy
        run: node scripts/check-package-manager-policy.mjs

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Validate release evidence registry
        run: corepack yarn release:evidence:check

      - name: Test release evidence checker fail-closed semantics
        run: corepack yarn release:evidence:test

      - name: Test Product Surface readiness and internal closure semantics
        run: corepack yarn product-surfaces:readiness:test

      - name: Validate Product Surface readiness integrity
        run: corepack yarn product-surfaces:readiness:check

      - name: Test official Backend contract binding semantics
        run: corepack yarn release:contracts:test

      - name: Test Provider artifact DLP scanner fail-closed semantics
        run: corepack yarn provider:artifacts:scan:test

      - name: Audit high severity dependencies
        run: corepack yarn security:audit

      - name: Validate production dependency licenses
        run: corepack yarn license:check

      - name: Generate frontend CycloneDX SBOM
        run: corepack yarn sbom:generate

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: frontend-cyclonedx-sbom
          path: build/reports/sbom/
          if-no-files-found: error
          retention-days: 30

      - name: Install Playwright browsers
        run: corepack yarn playwright install --with-deps chromium webkit

      - name: Check formatting
        run: corepack yarn format:check

      - name: Lint source and design-system boundaries
        run: corepack yarn lint

      - name: Check types
        run: corepack yarn typecheck

      - name: Check generated Gateway API contracts
        run: corepack yarn openapi:check

      - name: Run unit tests
        run: corepack yarn test

      - name: Build and enforce bundle budgets
        run: corepack yarn build

      - name: Build isolated product artifacts
        run: corepack yarn build:products

      - name: Smoke test isolated product artifact routing
        run: corepack yarn test:product-artifacts

      - name: Run shell contract gates
        run: corepack yarn playwright test e2e/shell-contract.spec.ts --project=chromium

      - name: Run responsive and accessibility gates
        run: corepack yarn playwright test e2e/responsive-accessibility.spec.ts --project=chromium --workers=1

      - name: Run Provider control-plane and tenant-boundary gates
        id: provider_e2e
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-provider
          PLAYWRIGHT_OUTPUT_DIR: test-results/provider
        run: corepack yarn test:e2e:provider

      - name: Scan Provider acceptance artifacts for secrets and PII
        if: ${{ !cancelled() && (steps.provider_e2e.outcome == 'success' || steps.provider_e2e.outcome == 'failure') }}
        run: corepack yarn provider:artifacts:scan playwright-report-provider test-results/provider

      - name: Upload Provider acceptance report
        if: ${{ !cancelled() && (steps.provider_e2e.outcome == 'success' || steps.provider_e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: provider-e2e-report
          path: |
            playwright-report-provider/
            test-results/provider/
          if-no-files-found: error
          retention-days: 30

      - name: Run Flow Home interaction and responsive gates
        run: corepack yarn playwright test e2e/flow-home.spec.ts --project=chromium --workers=1

      - name: Run Widget Library feature-off rollback gate
        run: corepack yarn test:e2e:widget-library-off

      - name: Run Flow Home visual regression gates
        run: corepack yarn playwright test e2e/flow-home-visual.spec.ts --project=chromium --project=mobile --workers=1

      - name: Run Workplace booking and administration gates
        run: corepack yarn playwright test e2e/rooms.spec.ts --project=chromium --workers=1

      - name: Run Product Surface pilot gates on desktop and mobile
        run: corepack yarn playwright test e2e/product-surface-approvals-pilot.spec.ts --project=chromium --project=mobile --workers=1

      - name: Run Product Surface separation gates on desktop and mobile
        run: corepack yarn playwright test e2e/product-surface-menu-separation.spec.ts --project=chromium --project=mobile --workers=1

      - name: Run runtime performance gate in isolation
        run: corepack yarn test:performance

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
