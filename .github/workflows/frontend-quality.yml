          corepack prepare yarn@4.17.1 --activate

      - name: Restore Yarn cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Install Playwright Chromium
        run: corepack yarn playwright install chromium

      - name: Run approved Darwin Calendar visual baselines
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-calendar-visual
          PLAYWRIGHT_OUTPUT_DIR: test-results/calendar-visual
        run: >-
          corepack yarn playwright test
          e2e/calendar-home-flow.spec.ts
          e2e/calendar-visual-quality.spec.ts
          --project=chromium --project=mobile --workers=1

      - name: Upload Calendar visual regression report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: calendar-visual-report-macos
          path: |
            playwright-report-calendar-visual/
            test-results/calendar-visual/
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
