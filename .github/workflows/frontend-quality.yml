name: Frontend quality

on:
  push:
    branches: [main, dev, dwp-dev]
  pull_request:
    branches: [main, dev, dwp-dev]

permissions:
  contents: read

jobs:
  quality:
    name: Static, bundle, and runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YARN_ENABLE_HARDENED_MODE: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Restore Yarn cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enforce Yarn workspace policy
        run: node scripts/check-package-manager-policy.mjs

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Validate release evidence registry
        run: corepack yarn release:evidence:check

      - name: Test release evidence checker fail-closed semantics
        run: corepack yarn release:evidence:test

      - name: Test Product Surface readiness and internal closure semantics
        run: corepack yarn product-surfaces:readiness:test

      - name: Validate Product Surface readiness integrity
        run: corepack yarn product-surfaces:readiness:check

      - name: Test official Backend contract binding semantics
        run: corepack yarn release:contracts:test

      - name: Test Provider artifact DLP scanner fail-closed semantics
        run: corepack yarn provider:artifacts:scan:test

      - name: Audit high severity dependencies
        run: corepack yarn security:audit

      - name: Validate production dependency licenses
        run: corepack yarn license:check

      - name: Generate frontend CycloneDX SBOM
        run: corepack yarn sbom:generate

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: frontend-cyclonedx-sbom
          path: build/reports/sbom/
          if-no-files-found: error
          retention-days: 30

      - name: Install Playwright browsers
        run: corepack yarn playwright install --with-deps chromium webkit

      - name: Check formatting
        run: corepack yarn format:check

      - name: Lint source and design-system boundaries
        run: corepack yarn lint

      - name: Test source-size, design-system, i18n, and reachability ratchet semantics
        run: corepack yarn quality-ratchets:test

      - name: Check types
        run: corepack yarn typecheck

      - name: Check generated Gateway API contracts
        run: corepack yarn openapi:check

      - name: Verify widget golden manifests and dependent semantic evidence
        run: node docs/05-features/DWP-R1-ADM-009-widget-ecosystem-governance/fixtures/verify-golden.mjs

      - name: Run unit tests
        run: corepack yarn test

      - name: Build and enforce bundle budgets
        run: corepack yarn build

      - name: Build isolated product artifacts
        run: corepack yarn build:products

      - name: Validate pinned Nginx route and security-header matrix
        run: corepack yarn nginx:check

      - name: Smoke test isolated product artifact routing
        run: corepack yarn test:product-artifacts

      - name: Run shell contract gates
        run: corepack yarn playwright test e2e/shell-contract.spec.ts --project=chromium

      - name: Run shell behavior and accessibility gates
        run: corepack yarn playwright test e2e/shell.spec.ts --project=chromium --project=mobile --workers=1

      - name: Run responsive and accessibility gates
        run: corepack yarn playwright test e2e/responsive-accessibility.spec.ts --project=chromium --workers=1

      - name: Run design-system Storybook interaction and accessibility gates
        run: corepack yarn test:storybook --project=chromium --ignore-snapshots

      - name: Run Provider control-plane and tenant-boundary gates
        id: provider_e2e
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-provider
          PLAYWRIGHT_OUTPUT_DIR: test-results/provider
        run: corepack yarn test:e2e:provider

      - name: Scan Provider acceptance artifacts for secrets and PII
        if: ${{ !cancelled() && (steps.provider_e2e.outcome == 'success' || steps.provider_e2e.outcome == 'failure') }}
        run: corepack yarn provider:artifacts:scan playwright-report-provider test-results/provider

      - name: Upload Provider acceptance report
        if: ${{ !cancelled() && (steps.provider_e2e.outcome == 'success' || steps.provider_e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: provider-e2e-report
          path: |
            playwright-report-provider/
            test-results/provider/
          if-no-files-found: error
          retention-days: 30

      - name: Run Flow Home interaction and responsive gates
        run: corepack yarn playwright test e2e/flow-home.spec.ts --project=chromium --workers=1

      - name: Run Widget Library feature-off rollback gate
        run: corepack yarn test:e2e:widget-library-off

      - name: Run Widget Library and governance gates
        run: corepack yarn playwright test e2e/widget-catalog.spec.ts e2e/widget-catalog-resilience.spec.ts e2e/widget-governance-surfaces.spec.ts --project=chromium --workers=1 --ignore-snapshots

      - name: Run governed menu route contracts
        run: corepack yarn playwright test e2e/menu-route-contract.spec.ts --project=chromium --project=mobile --workers=2

      - name: Run Workplace member and operator smoke gates on desktop and mobile
        run: corepack yarn test:e2e:workplace:smoke

      - name: Run Product Surface pilot gates on desktop and mobile
        run: corepack yarn playwright test e2e/product-surface-approvals-pilot.spec.ts --project=chromium --project=mobile --workers=1

      - name: Run Product Surface separation gates on desktop and mobile
        run: corepack yarn playwright test e2e/product-surface-menu-separation.spec.ts --project=chromium --project=mobile --workers=1

      - name: Run runtime performance gate in isolation
        run: corepack yarn test:performance

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

  calendar-quality:
    name: Calendar behavior and accessibility gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YARN_ENABLE_HARDENED_MODE: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Restore Yarn cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Install Playwright Chromium
        run: corepack yarn playwright install --with-deps chromium

      - name: Run Calendar behavior, resilience, responsive, and accessibility gates
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-calendar
          PLAYWRIGHT_OUTPUT_DIR: test-results/calendar
        run: >-
          corepack yarn playwright test
          e2e/calendar-advanced-scheduling.spec.ts
          e2e/calendar-enterprise.spec.ts
          e2e/calendar-home-enterprise.spec.ts
          e2e/calendar-home-flow.spec.ts
          e2e/calendar-home-rail-design.spec.ts
          e2e/calendar-insights-and-settings.spec.ts
          e2e/calendar-precision-design.spec.ts
          e2e/calendar-visual-quality.spec.ts
          e2e/calendar-work-handoff.spec.ts
          e2e/flow-home-calendar-insights.spec.ts
          --project=chromium --project=mobile --workers=1 --ignore-snapshots

      - name: Upload Calendar acceptance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: calendar-e2e-report
          path: |
            playwright-report-calendar/
            test-results/calendar/
          if-no-files-found: error
          retention-days: 30

  calendar-webkit-quality:
    name: Calendar Safari/WebKit compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YARN_ENABLE_HARDENED_MODE: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Restore Yarn cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Install Playwright WebKit
        run: corepack yarn playwright install --with-deps webkit

      - name: Run Calendar desktop and mobile WebKit smoke gates
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-calendar-webkit
          PLAYWRIGHT_OUTPUT_DIR: test-results/calendar-webkit
        run: corepack yarn test:e2e:calendar:webkit

      - name: Upload Calendar WebKit acceptance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: calendar-webkit-e2e-report
          path: |
            playwright-report-calendar-webkit/
            test-results/calendar-webkit/
          if-no-files-found: error
          retention-days: 30

  mail-quality:
    name: Mail behavior, governance, and accessibility gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YARN_ENABLE_HARDENED_MODE: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Restore Yarn cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Install Playwright Chromium
        run: corepack yarn playwright install --with-deps chromium

      - name: Run all Mail desktop and mobile behavior gates
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-mail
          PLAYWRIGHT_OUTPUT_DIR: test-results/mail
        run: corepack yarn test:e2e:mail

      - name: Upload Mail acceptance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mail-e2e-report
          path: |
            playwright-report-mail/
            test-results/mail/
          if-no-files-found: error
          retention-days: 30

  activity-quality:
    name: Activity behavior, resilience, accessibility, and native zoom gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_BASE_URL: http://127.0.0.1:4200
      E2E_TIMEZONE_ID: Asia/Seoul
      YARN_ENABLE_HARDENED_MODE: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Restore Yarn cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Install Activity Playwright browsers
        run: corepack yarn playwright install --with-deps chromium webkit

      - name: Run Activity Chromium acceptance gates
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-activity-chromium
          PLAYWRIGHT_OUTPUT_DIR: test-results/activity-chromium
        run: >-
          corepack yarn playwright test
          e2e/activity-foundation.spec.ts
          e2e/activity-stitch-visual-quality.spec.ts
          e2e/dwaion-activity-list-detail.spec.ts
          e2e/activity-source-link.spec.ts
          e2e/activity-personal-work-handoff.spec.ts
          e2e/activity-work-handoff.spec.ts
          e2e/work-activity-return-focus.spec.ts
          --project=chromium --workers=1 --ignore-snapshots

      - name: Run Activity mobile acceptance gates
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-activity-mobile
          PLAYWRIGHT_OUTPUT_DIR: test-results/activity-mobile
        run: >-
          corepack yarn playwright test
          e2e/activity-foundation.spec.ts
          e2e/activity-stitch-visual-quality.spec.ts
          e2e/dwaion-activity-list-detail.spec.ts
          e2e/activity-source-link.spec.ts
          e2e/activity-personal-work-handoff.spec.ts
          e2e/activity-work-handoff.spec.ts
          e2e/work-activity-return-focus.spec.ts
          --project=mobile --workers=1 --ignore-snapshots

      - name: Run real Chromium 200 percent tab zoom gate
        env:
          E2E_BROWSER_ZOOM_EXTENSION: ${{ github.workspace }}/docs/05-features/DWP-R1-WRK-001-unified-work-execution/implementation-evidence/2026-09-07-resume/mobile-accessibility-final/qa-browser-zoom-extension
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-activity-zoom
          PLAYWRIGHT_OUTPUT_DIR: test-results/activity-zoom
        run: >-
          corepack yarn playwright test
          e2e/activity-stitch-visual-quality.spec.ts
          --project=chromium --workers=1
          --grep "브라우저 실제 200% 확대"

      - name: Upload Activity acceptance and native zoom reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: activity-e2e-report
          path: |
            playwright-report-activity-chromium/
            playwright-report-activity-mobile/
            playwright-report-activity-zoom/
            test-results/activity-chromium/
            test-results/activity-mobile/
            test-results/activity-zoom/
          if-no-files-found: error
          retention-days: 30

  visual-baselines:
    name: Approved macOS pixel baselines
    runs-on: macos-15
    timeout-minutes: 60
    env:
      E2E_TIMEZONE_ID: Asia/Seoul
      YARN_ENABLE_HARDENED_MODE: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Restore Yarn cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Install Playwright browsers
        run: corepack yarn playwright install chromium webkit

      - name: Run approved design-system Storybook pixel baselines
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/storybook
          PLAYWRIGHT_OUTPUT_DIR: test-results/storybook
        run: corepack yarn test:storybook --project=chromium --project=mobile

      - name: Run approved Darwin core visual baselines (desktop)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/core-desktop
          PLAYWRIGHT_OUTPUT_DIR: test-results/core-desktop
        run: corepack yarn playwright test e2e/visual.spec.ts e2e/shell-visual.spec.ts e2e/video-meeting-visual-quality.spec.ts --project=chromium --workers=1

      - name: Run approved Darwin core visual baselines (mobile)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/core-mobile
          PLAYWRIGHT_OUTPUT_DIR: test-results/core-mobile
        run: corepack yarn playwright test e2e/visual.spec.ts e2e/shell-visual.spec.ts e2e/video-meeting-visual-quality.spec.ts --project=mobile --workers=1

      - name: Run approved Darwin menu visual baselines (desktop 1/2)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/menu-desktop-1
          PLAYWRIGHT_OUTPUT_DIR: test-results/menu-desktop-1
        run: corepack yarn playwright test e2e/menu-visual-baseline.spec.ts --project=chromium --workers=1 --shard=1/2

      - name: Run approved Darwin menu visual baselines (desktop 2/2)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/menu-desktop-2
          PLAYWRIGHT_OUTPUT_DIR: test-results/menu-desktop-2
        run: corepack yarn playwright test e2e/menu-visual-baseline.spec.ts --project=chromium --workers=1 --shard=2/2

      - name: Run approved Darwin menu visual baselines (mobile 1/2)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/menu-mobile-1
          PLAYWRIGHT_OUTPUT_DIR: test-results/menu-mobile-1
        run: corepack yarn playwright test e2e/menu-visual-baseline.spec.ts --project=mobile --workers=1 --shard=1/2

      - name: Run approved Darwin menu visual baselines (mobile 2/2)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/menu-mobile-2
          PLAYWRIGHT_OUTPUT_DIR: test-results/menu-mobile-2
        run: corepack yarn playwright test e2e/menu-visual-baseline.spec.ts --project=mobile --workers=1 --shard=2/2

      - name: Run approved Darwin Flow Home visual baselines (desktop)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/flow-home-desktop
          PLAYWRIGHT_OUTPUT_DIR: test-results/flow-home-desktop
        run: corepack yarn playwright test e2e/flow-home-visual.spec.ts --project=chromium --workers=1

      - name: Run approved Darwin Flow Home visual baselines (mobile)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/flow-home-mobile
          PLAYWRIGHT_OUTPUT_DIR: test-results/flow-home-mobile
        run: corepack yarn playwright test e2e/flow-home-visual.spec.ts --project=mobile --workers=1

      - name: Run approved Darwin Activity visual baselines
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/activity
          PLAYWRIGHT_OUTPUT_DIR: test-results/activity-visual
        run: corepack yarn playwright test e2e/activity-stitch-visual-quality.spec.ts --project=chromium --workers=1

      - name: Run approved Darwin Mail visual baselines
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/mail
          PLAYWRIGHT_OUTPUT_DIR: test-results/mail
        run: corepack yarn test:e2e:mail:visual

      - name: Upload visual regression report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-visual-report-macos
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

  calendar-visual-baselines:
    name: Approved Calendar macOS pixel baselines
    runs-on: macos-15
    timeout-minutes: 60
    env:
      E2E_TIMEZONE_ID: Asia/Seoul
      YARN_ENABLE_HARDENED_MODE: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and activate Yarn
        run: |
