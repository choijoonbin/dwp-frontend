x-dwp-provided-snapshots:
  - name: ApprovedCompensationPlanSnapshot.v1
    version: 1
    operationId: getApprovedCompensationPlanSnapshot
    requiredFields: [snapshotId, snapshotRevision, planId, cycleId, effectiveFrom, effectiveTo, approvalReceiptId, sourceVersion, lineCount, lines, payloadDigest]
    lineRequiredFields: [lineId, lineSequence, workerId, assignmentId, componentCode, currency, approvedAmount, effectiveFrom, effectiveTo, lineDigest]
    streamingTransport:
      wireVersion: V1_JSON_ARRAY
      gatewayBuffering: FORBIDDEN_STREAM_THROUGH
      backpressure: END_TO_END_REACTIVE_PULL_WITH_BOUNDED_QUEUES
      lineCeiling: 100000
      maxHeaderBytes: 65536
      maxLineBytes: 4096
      maxPayloadBytes: 536870912
      maxCompressedPayloadBytes: 134217728
      maxUncompressedPayloadBytes: 536870912
      maxCompressionRatio: 100
      byteAccounting: COUNT_COMPRESSED_AND_STREAMING_DECOMPRESSED_BYTES_BEFORE_ALLOCATION
      sequenceValidation: LINE_SEQUENCE_EQUALS_ARRAY_INDEX_PLUS_1_CONTIGUOUS_NO_GAP_OR_DUPLICATE
      digest: INCREMENTAL_CANONICAL_HEADER_THEN_ORDERED_LINES
      consumerIngest: STAGED_TEMPORARY_ROWS
      finalize: ATOMIC_AFTER_COUNT_SEQUENCE_AND_DIGEST_VALIDATION
      failure: ROLLBACK_STAGED_ROWS_AND_QUARANTINE_RECEIPT

x-dwp-internal-operations:
  - operationId: getApprovedCompensationPlanSnapshot
    method: GET
    path: /internal/hris-performance/v1/approved-compensation-plan-snapshots/{snapshotId}
    callerWorkload: dwp-payroll-server
    purposeCode: HRIS_APPROVED_COMPENSATION_PLAN_SNAPSHOT_REFETCH
    response: ApprovedCompensationPlanSnapshot.v1
    responseRequired: [snapshotId, snapshotRevision, planId, cycleId, effectiveFrom, effectiveTo, approvalReceiptId, sourceVersion, lineCount, lines, payloadDigest]
    responseLineRequired: [lineId, lineSequence, workerId, assignmentId, componentCode, currency, approvedAmount, effectiveFrom, effectiveTo, lineDigest]
    rules:
      - mTLS workload identity, signed tenant claim and owner tenant grant are mandatory.
      - The snapshot must be APPROVED, immutable and digest-verifiable; stale or superseded references fail closed.
      - Return 1..100000 lines ordered by contiguous lineSequence from 1; lineCount must equal lines length and lineId/lineSequence are unique.
      - Stream through every proxy with bounded reactive backpressure; count compressed and uncompressed bytes independently before allocation and reject a payload over either byte limit, the compression-ratio limit, the per-line limit or the line ceiling.
      - approvedAmount is a canonical non-exponent decimal string matching PostedMoney NUMERIC(19,4); binary float, negative zero, cross-currency arithmetic and implicit database rounding are forbidden.
      - payloadDigest covers the canonical header plus ordered canonical line values including decimal strings; Payroll materializes exactly N input rows from N lines atomically.
      - A sequence gap/duplicate, digest/count mismatch, decompression failure, cancellation or storage failure rolls back every staged row and seals a quarantined receipt; no partial snapshot becomes queryable.
      - Browser routing, caller-selected tenant and fields outside the payroll projection are forbidden.
  - operationId: materializePerformanceHomeContribution
    method: GET
    path: /internal/hris-performance/v1/home-contributions/{payloadRef}
    callerWorkload: dwp-platform-server
    purposeCode: HRIS_HOME_CONTRIBUTION_MATERIALIZE
    response: PerformanceHomeContribution.v1
    requestContextRequired: [subjectPrincipalPublicId, effectivePermissionRevision, populationScopeDigest, fieldPolicyRevision, widgetKey, browserAudience, ownerPopulationScope, scopeRevision, correlationId]
    responseRequired: [module, widgetKey, widgetType, browserAudience, ownerPopulationScope, scopeRevision, populationScopeDigest, fieldPolicyRevision, purposeCode, state, generatedAt, freshUntil, staleAfter, deepLink, sourceVersion, payloadRef, payloadDigest, asOf, data, fieldDecisions, partialFailures]
    typedDataProfile: PerformanceHomeData
    browserProjection: dwp.hris.system.transport.v1#/$defs/HomeWidget
    rules:
      - mTLS workload identity, signed tenant claim and owner tenant grant are mandatory.
      - Signed on-behalf-of subject context is mandatory and cannot be overridden by request body.
      - Widget capability, effective permission revision, population scope, purpose and field projection are re-evaluated.
      - payloadRef is opaque, tenant-bound and payloadDigest is verified before materialization.
      - Browser routing and caller-selected tenant are forbidden.
      - data is the closed PerformanceHomeData profile; arbitrary JSON, scores, comments, feedback text and browser payloadRef are forbidden.
      - SYS removes payloadRef and revalidates the widget discriminant, audience, scope revision, field-policy revision, freshness and deep link before browser serialization.

x-dwp-consumed-snapshots:
  - name: WorkerAssignmentSnapshot.v1
    owner: dwp-people-server/hris/core
    required: [snapshotVersion, asOf, personPublicId, workerPublicId, workerStatus, relationships, assignments]
    behavior: Freeze the exact owner revision for a published performance population; drafts may refresh explicitly.

x-dwp-consumed-events:
  - name: WorkerChanged.v1
    owner: dwp-people-server/hris/core
    payload: [workerPublicId, changeType, effectiveDate, newAggregateVersion]
    behavior: Invalidate non-frozen participant previews and refetch the canonical snapshot.
  - name: EmploymentChanged.v1
    owner: dwp-people-server/hris/core
    payload: [relationshipPublicId, changeType, effectiveDate, newAggregateVersion]
    behavior: Re-evaluate draft eligibility by effective instant; retain frozen population lineage.
  - name: AssignmentChanged.v1
    owner: dwp-people-server/hris/core
    payload: [assignmentPublicId, eventPublicId, eventType, effectiveDate, changedReferences, newAggregateVersion]
    behavior: Invalidate only non-frozen previews; never mutate an existing population freeze.
  - name: OrganizationChanged.v1
    owner: dwp-people-server/hris/core
    payload: [revisionPublicId, effectiveDate, changedOrganizationPublicIds, snapshotDigest]
    behavior: Recompute draft previews by effective instant; retain frozen revision lineage.
  - name: ApprovalDecisionRecorded.v1
    owner: dwp-approval-server
