openapi: 3.1.0
info:
  title: DWP HRIS Performance API
  version: 1.0.0-draft
  description: >-
    G2 contract proposal owned by dwp-people-server/hris/performance. Tenant and actor
    are derived from trusted authentication context; clients cannot select another tenant.
servers:
  - url: /api/people/v1/hris/performance
x-dwp-routing:
  gatewayBasePath: /api/people/v1/hris/performance
  controllerBasePath: /v1/hris/performance
  internalBasePath: /internal/hris-performance/v1
  gatewayRule: service-key route /api/people/** with StripPrefix=2; internal paths are never gateway exposed
security:
  - dwpSession: []
tags:
  - name: Home
  - name: Cycles
  - name: Population
  - name: Goals
  - name: Reviews
  - name: Feedback
  - name: Checkins
  - name: Calibration
  - name: Results
  - name: Appeals
  - name: DataExchange

paths:
  /dashboard:
    get:
      tags: [Home]
      operationId: getPerformanceDashboard
      x-dwp-capabilities: [hcm.operations.performance.update, hcm.personal.performance.view, hcm.team.performance.review]
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Permission-trimmed widget projection; never a menu catalog.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PerformanceDashboard'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /cycles:
    get:
      tags: [Cycles]
      operationId: listCycles
      x-dwp-capability: per.cycle.view
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CyclePage'}
    post:
      tags: [Cycles]
      operationId: createCycle
      x-dwp-capability: per.cycle.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCycleCommand'}
      responses:
        '201':
          description: Cycle created
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cycle'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}

  /cycles/{cycleId}:
    get:
      tags: [Cycles]
      operationId: getCycle
      x-dwp-capability: per.cycle.view
      parameters:
        - $ref: '#/components/parameters/CycleId'
      responses:
        '200':
          description: Cycle resource
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cycle'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Cycles]
      operationId: updateCycleDraft
      x-dwp-capability: per.cycle.manage
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/UpdateCycleDraftCommand'}
      responses:
        '200':
          description: Updated draft
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cycle'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}

  /cycles/{cycleId}/validate:
    post:
      tags: [Cycles]
      operationId: validateCycle
      x-dwp-capability: per.cycle.manage
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Deterministic validation report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationReport'}
        '409': {$ref: '#/components/responses/Conflict'}

  /cycles/{cycleId}/publish:
    post:
      tags: [Cycles]
      operationId: publishCycle
      x-dwp-capability: per.cycle.publish
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishCommand'}
      responses:
        '202':
          description: Publish accepted after approval reference and step-up checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /cycles/{cycleId}/population-previews:
    post:
      tags: [Population]
      operationId: previewPopulation
      x-dwp-capability: per.population.preview
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PopulationPreviewCommand'}
      responses:
        '202':
          description: Preview job accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '422': {$ref: '#/components/responses/RuleViolation'}

  /cycles/{cycleId}/population-freezes:
    post:
      tags: [Population]
      operationId: freezePopulation
      x-dwp-capability: per.population.freeze
      parameters:
        - $ref: '#/components/parameters/CycleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FreezePopulationCommand'}
      responses:
        '202':
          description: Freeze accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}

  /goals:
    post:
      tags: [Goals]
      operationId: createGoal
      x-dwp-capabilities: [per.goal.self.write, per.goal.team.approve]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGoalCommand'}
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Goal'}
        '422': {$ref: '#/components/responses/RuleViolation'}

  /goals/{goalId}/submit:
    post:
      tags: [Goals]
      operationId: submitGoal
      x-dwp-capabilities: [per.goal.self.write, per.goal.team.approve]
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Submitted goal revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Goal'}
        '409': {$ref: '#/components/responses/Conflict'}

  /reviews/{reviewId}:
    get:
      tags: [Reviews]
      operationId: getAssignedReview
      x-dwp-capabilities: [hcm.team.performance.review, per.review.self.submit]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Field-policy-trimmed assigned review
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Reviews]
      operationId: saveReviewDraft
      x-dwp-capabilities: [hcm.team.performance.review, per.review.self.submit]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/ReviewDraftCommand'}
      responses:
        '200':
          description: Draft saved
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /reviews/{reviewId}/submit:
    post:
      tags: [Reviews]
      operationId: submitReview
      x-dwp-capabilities: [hcm.team.performance.review, per.review.self.submit]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitReviewCommand'}
      responses:
        '200':
          description: Immutable submission created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewSubmission'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}

  /feedback-requests:
    post:
      tags: [Feedback]
      operationId: createFeedbackRequest
      x-dwp-capability: per.feedback.request.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFeedbackRequestCommand'}
      responses:
        '201':
          description: Feedback request created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackRequest'}
        '422': {$ref: '#/components/responses/RuleViolation'}

  /check-ins:
    post:
      tags: [Checkins]
      operationId: createCheckin
      x-dwp-capability: per.checkin.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCheckinCommand'}
      responses:
        '201':
          description: Check-in created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Checkin'}

  /calibration-sessions/{sessionId}/adjustments:
    post:
      tags: [Calibration]
      operationId: appendCalibrationAdjustment
      x-dwp-capability: hcm.operations.performance.calibrate
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalibrationAdjustmentCommand'}
      responses:
        '201':
          description: Append-only adjustment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalibrationAdjustment'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /result-sets/{resultSetId}/publish:
    post:
      tags: [Results]
      operationId: publishResults
      x-dwp-capability: hcm.operations.performance.publish
      parameters:
        - $ref: '#/components/parameters/ResultSetId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishCommand'}
      responses:
        '202':
          description: Step-up and independent approval verified; publish accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /results/{resultId}/appeals:
    post:
      tags: [Appeals]
      operationId: openAppeal
      x-dwp-capability: per.appeal.self.open
      parameters:
        - $ref: '#/components/parameters/ResultId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenAppealCommand'}
      responses:
        '201':
          description: Appeal opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appeal'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /imports:
    post:
      tags: [DataExchange]
      operationId: requestImport
      x-dwp-capability: per.data-exchange.execute
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportCommand'}
      responses:
        '202':
          description: Import accepted; poll the receipt instead of retrying blindly.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '422': {$ref: '#/components/responses/RuleViolation'}

  /command-receipts/{receiptId}:
    get:
      tags: [DataExchange]
      operationId: getCommandReceipt
      x-dwp-capability: per.command-receipt.view
      x-dwp-authorization-context: SEALED_ORIGINATING_COMMAND_CONTEXT
      x-dwp-authorization-rule: MORE_RESTRICTIVE_OF_CURRENT_AND_ORIGINATING
      x-dwp-opaque-not-found-on-context-mismatch: true
      parameters:
        - $ref: '#/components/parameters/ReceiptId'
      responses:
        '200':
          description: Current receipt status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '404': {$ref: '#/components/responses/NotFound'}

  # Service-only routes are declared in the same OpenAPI so extraction, auth
  # binding and contract tests cannot drift. Gateway exposure is forbidden by
  # x-dwp-routing and the workload/tenant controls below.
  /internal/hris-performance/v1/approved-compensation-plan-snapshots/{snapshotId}:
    servers:
      - url: /
    get:
      tags: [DataExchange]
      operationId: getApprovedCompensationPlanSnapshot
      x-dwp-capability: approved PAY service contract
      security:
        - dwpWorkloadMtls: []
          dwpWorkloadJwt: [hris.internal]
      x-dwp-workload-auth:
        caller: dwp-payroll-server
        audience: dwp-people-server
        signedTenantClaim: required
        purposeCode: HRIS_APPROVED_COMPENSATION_PLAN_SNAPSHOT_REFETCH
      responses:
        '200':
          description: Immutable approved compensation-plan snapshot for the authenticated Payroll workload.
          x-dwp-canonical-schema: coding-readiness/cross-module-canonical-schemas.v1.json#/$defs/XCON_020
          x-dwp-projection-cardinality: one header and 1..100000 ordered contiguous lines; lineCount equals lines length
        '403': {$ref: '#/components/responses/Forbidden'}

  /internal/hris-performance/v1/home-contributions/{payloadRef}:
    servers:
      - url: /
    get:
      tags: [Home]
      operationId: materializePerformanceHomeContribution
      x-dwp-capability: approved SYS home projection contract
      security:
        - dwpWorkloadMtls: []
          dwpWorkloadJwt: [hris.internal]
      x-dwp-workload-auth:
        caller: dwp-platform-server
        audience: dwp-people-server
        signedTenantClaim: required
        purposeCode: HRIS_HOME_CONTRIBUTION_MATERIALIZE
      responses:
        '200':
          description: Subject-delegated and permission-trimmed performance home contribution.
        '403': {$ref: '#/components/responses/Forbidden'}

components:
  securitySchemes:
    dwpSession:
      type: openIdConnect
      openIdConnectUrl: /.well-known/openid-configuration
    dwpWorkloadMtls:
      type: mutualTLS
      description: SPIFFE workload identity pinned to the registered caller and owner service.
    dwpWorkloadJwt:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            hris.internal: Invoke an allowlisted HRIS service-only contract.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 200}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[0-9]+"$'}
    AsOf:
      name: asOf
      in: query
      schema: {type: string, format: date-time}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 500}
    PageSize:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    CycleId:
      name: cycleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GoalId:
      name: goalId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ResultSetId:
      name: resultSetId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ResultId:
      name: resultId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    ETag:
      schema: {type: string, pattern: '^"[0-9]+"$'}
  responses:
    Forbidden:
      description: App entitlement, capability, population, field, purpose, step-up or SoD denied.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Tenant-safe absence; response does not reveal cross-tenant existence.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Stale expected version, illegal state transition or idempotency-key payload mismatch.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RuleViolation:
      description: Domain validation failed with stable issue codes.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    CanonicalDecimal6:
      type: string
      pattern: '^-?(?:0|[1-9][0-9]{0,12})(?:\.[0-9]{1,6})?$'
      x-valueType: CalculationDecimal
      x-rounding: HALF_UP_BEFORE_PERSISTENCE
      x-exponentNotation: FORBIDDEN
    UnitRatioDecimal:
      type: string
      pattern: '^(?:0(?:\.[0-9]{1,6})?|1(?:\.0{1,6})?)$'
      x-valueType: CalculationDecimal
      x-rounding: HALF_UP_BEFORE_PERSISTENCE
      x-exponentNotation: FORBIDDEN
    DashboardGoalSummary:
      type: object
      additionalProperties: false
      required: [totalCount, activeCount, overdueCount]
      properties:
        totalCount: {type: integer, minimum: 0}
        activeCount: {type: integer, minimum: 0}
        overdueCount: {type: integer, minimum: 0}
    DashboardReviewSummary:
      type: object
      additionalProperties: false
      required: [totalCount, awaitingSelfCount, awaitingManagerCount, overdueCount]
      properties:
        totalCount: {type: integer, minimum: 0}
        awaitingSelfCount: {type: integer, minimum: 0}
        awaitingManagerCount: {type: integer, minimum: 0}
        overdueCount: {type: integer, minimum: 0}
    DashboardResultSummary:
      type: object
      additionalProperties: false
      required: [publishedCount, pendingPublicationCount, openAppealCount]
      properties:
        publishedCount: {type: integer, minimum: 0}
        pendingPublicationCount: {type: integer, minimum: 0}
        openAppealCount: {type: integer, minimum: 0}
    PerformanceDashboard:
      type: object
      additionalProperties: false
      required: [asOf, tasks, goalSummary, reviewSummary, resultSummary, partialFailures]
      properties:
        asOf: {type: string, format: date-time}
        tasks: {type: array, items: {$ref: '#/components/schemas/TaskSummary'}}
        goalSummary: {$ref: '#/components/schemas/DashboardGoalSummary'}
        reviewSummary: {$ref: '#/components/schemas/DashboardReviewSummary'}
        resultSummary: {$ref: '#/components/schemas/DashboardResultSummary'}
        partialFailures: {type: array, items: {$ref: '#/components/schemas/PartialFailure'}}
    TaskSummary:
      type: object
      additionalProperties: false
      required: [taskId, taskType, dueAt, deepLink]
      properties:
        taskId: {type: string, format: uuid}
        taskType: {type: string, enum: [GOAL_DUE, REVIEW_DUE, FEEDBACK_DUE, CHECKIN_DUE, RESULT_ACKNOWLEDGEMENT, APPEAL_ACTION]}
        dueAt: {type: string, format: date-time}
        deepLink: {type: string, pattern: '^/hr/(?:my|team|performance)/[a-z0-9/_-]+$'}
    PartialFailure:
      type: object
      additionalProperties: false
      required: [widgetKey, issueCode, retryable]
      properties:
        widgetKey: {type: string}
        issueCode: {type: string}
        retryable: {type: boolean}
    CyclePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Cycle'}}
        nextCursor: {type: [string, 'null']}
    Cycle:
      type: object
      additionalProperties: false
      required: [cycleId, cycleKey, displayName, lifecycleState, aggregateVersion]
      properties:
        cycleId: {type: string, format: uuid}
        cycleKey: {type: string}
        displayName: {type: string}
        lifecycleState: {type: string, enum: [DRAFT, VALIDATED, PUBLISHED, ACTIVE, CLOSED, RETIRED]}
        activeVersionNo: {type: [integer, 'null']}
        aggregateVersion: {type: integer, minimum: 0}
        stages: {type: array, items: {$ref: '#/components/schemas/CycleStage'}}
    CycleStage:
      type: object
      additionalProperties: false
      required: [stageKey, stageType, sequenceNo, opensAt, closesAt]
      properties:
        stageKey: {type: string}
        stageType: {type: string}
        sequenceNo: {type: integer, minimum: 1}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
    CreateCycleCommand:
      type: object
      additionalProperties: false
      required: [cycleKey, displayName, timezoneId, retentionPolicyId]
      properties:
        cycleKey: {type: string, minLength: 1, maxLength: 100}
        displayName: {type: string, minLength: 1, maxLength: 240}
        timezoneId: {type: string, minLength: 1, maxLength: 80}
        retentionPolicyId: {type: string, format: uuid}
    UpdateCycleDraftCommand:
      type: object
      additionalProperties: false
      properties:
        displayName: {type: string, minLength: 1, maxLength: 240}
        stages: {type: array, minItems: 1, items: {$ref: '#/components/schemas/CycleStage'}}
        policyVersionId: {type: string, format: uuid}
    PublishCommand:
      type: object
      additionalProperties: false
      required: [approvalRef, stepUpEvidenceRef]
      properties:
        approvalRef: {type: string, format: uuid}
        stepUpEvidenceRef: {type: string, format: uuid}
    PopulationPreviewCommand:
      type: object
      additionalProperties: false
      required: [populationRuleId, workforceSnapshotId, workforceSnapshotRevision]
      properties:
        populationRuleId: {type: string, format: uuid}
        workforceSnapshotId: {type: string, format: uuid}
        workforceSnapshotRevision: {type: integer, minimum: 0}
    FreezePopulationCommand:
      allOf:
        - $ref: '#/components/schemas/PopulationPreviewCommand'
        - type: object
          additionalProperties: false
          required: [previewContentHash]
          properties:
            previewContentHash: {type: string, pattern: '^[0-9a-f]{64}$'}
    CreateGoalCommand:
      type: object
      additionalProperties: false
      required: [cycleVersionId, ownerType, ownerPublicId, title, measurement, weight, periodStart, periodEnd]
      properties:
        cycleVersionId: {type: string, format: uuid}
        ownerType: {type: string, enum: [WORKER, ORGANIZATION, TEAM]}
        ownerPublicId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 500}
        measurement: {$ref: '#/components/schemas/GoalMeasurement'}
        weight: {$ref: '#/components/schemas/UnitRatioDecimal'}
        periodStart: {type: string, format: date}
        periodEnd: {type: string, format: date}
    GoalMeasurement:
      oneOf:
        - $ref: '#/components/schemas/QuantitativeGoalMeasurement'
