  add_header_inherit merge;
  return 404;
}

location ^~ /assets/dwp/workspace/assets/ {
  alias /srv/dwp/workspace/assets/;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header_inherit merge;
  error_page 404 = @dwp_asset_not_found;
}

